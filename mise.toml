[tasks.build]
description = "构建 Release 版本"
run = "./build.sh build"

[tasks.debug]
description = "构建 Debug 版本"
run = "./build.sh debug"

[tasks.clean]
description = "清理构建产物"
run = "./build.sh clean"

[tasks.archive]
description = "构建并归档为 .xcarchive"
run = "./build.sh archive"

[tasks.export]
description = "归档并导出 .app（需先 archive）"
run = "./build.sh export"

[tasks.dmg]
description = "构建并打包为 .dmg 安装镜像"
run = "./build.sh dmg"

[tasks.sign]
description = "sign_update 为 DMG 签名并输出 appcast 条目"
run = "./build.sh sign"

[tasks.appcast]
description = "更新 appcast.xml 中的版本条目（基于 DMG 签名文件）"
run = "./build.sh appcast"

[tasks.bump]
description = "从 VERSION 文件读取版本号并更新项目"
run = "./build.sh bump"

[tasks.release]
description = "一键发布：构建 → DMG → 签名 → 更新 appcast.xml"
run = "./build.sh release"

[tasks.help]
description = "显示帮助信息"
run = "./build.sh help"
